<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sustainable pathways for biomedical innovation</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2a26;--mu:#5d6b66;--ac:#0f766e;--ac2:#e7f3f1;--ok:#15803d;--wn:#b45309;--go:#b91c1c;--bd:#d9dfdb;--bt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a18;--card:#1b2623;--tx:#e8efec;--mu:#9fb0aa;--ac:#2dd4bf;--ac2:#18312d;--ok:#4ade80;--wn:#fbbf24;--go:#f87171;--bd:#2c3b37;--bt:#06201c}}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
#hud{display:flex;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
#hud[hidden]{display:none}#hud{align-items:stretch}#rs{padding:6px 12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);font-size:14px;font-weight:600}
#hud div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:14px;color:var(--mu)}
#hud b{display:block;font-size:22px;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px 22px;margin:12px 0}
h1{font-size:clamp(24px,5vw,36px);line-height:1.2;margin:.2em 0}h2{font-size:22px;margin:.2em 0}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--wn)}.tag.go{color:var(--go)}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:var(--bt);border-radius:10px;padding:12px 22px;font-weight:600}
button.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:10px 0;font-weight:400}
button.opt:hover:not(:disabled){border-color:var(--ac);background:var(--ac2)}button.opt:disabled{opacity:.45;cursor:not-allowed}
button.opt small{color:var(--mu)}
.fx{display:flex;gap:16px;font-weight:700;margin:10px 0}.neg{color:var(--go)}.pos{color:var(--ok)}
.les{border-left:4px solid var(--wn);padding:4px 14px;background:var(--ac2);border-radius:0 8px 8px 0;margin:12px 0}
.big{font-size:56px;font-weight:800;color:var(--ac);line-height:1}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:8px;background:var(--ac);border-radius:4px}.note{font-size:13px;color:var(--mu)}.center{text-align:center}
.wrap{overflow-x:auto}a{color:var(--ac)}
</style></head>
<body><main>
<div id="hud" hidden><div>Budget Points<b id="bp">100</b></div><div>Accessibility<b id="ap">0</b></div><button id="rs" data-a="restart">↺ Restart</button></div>
<div id="app"></div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* >>> Paste your Google Apps Script web-app URL between the quotes (see instructions). Leave empty to play without saving. */
const SHEET_URL='';
const RUN_ID=(self.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));
let S,chain=Promise.resolve();

/* ---------- CONTENT ---------- */
const CTX1=`<p><b>Lahore, intensive care unit.</b> Amina, 34, is on a ventilator after a road accident. Three days later she develops pneumonia. The lab report reads: <i>Acinetobacter baumannii</i>, resistant to carbapenems and to every other antibiotic the hospital has. Within two weeks, four more patients in the same unit test positive.</p>
<p>She is not an isolated case. Hospitals around the world are reporting infections that do not respond to any available antibiotic.</p>
<ol><li>Antimicrobial-resistant infections already caused 1.27 million deaths in 2019 alone, and the number keeps rising.</li>
<li>The WHO lists carbapenem-resistant <i>Acinetobacter baumannii</i> (CRAB) as a critical-priority pathogen. It survives for weeks on dry hospital surfaces and spreads through ventilators and catheters.</li>
<li>Developing a new antibiotic takes over a decade and costs hundreds of millions of euros.</li>
<li>Once approved, a new antibiotic must be kept as a last resort to slow down resistance, so it is barely sold. Achaogen got its antibiotic plazomicin approved in 2018 and filed for bankruptcy less than a year later.</li>
<li>The heaviest burden falls on low- and middle-income countries, where access to even existing antibiotics is limited.</li></ol>`;
const CTX2=`<p>A government has organized an urgent committee of experts to develop a financial and policy roadmap. Your committee has been granted an initial pool of <b>100 Budget Points</b> to guide a promising new antibiotic against CRAB from the laboratory bench all the way to patients who need it most, without:</p>
<ol><li>Going bankrupt (0 Budget Points)</li><li>Leaving low-income nations behind</li><li>Triggering new resistance</li></ol>
<p>Decisions are final unless the game explicitly lets you try again.</p>`;

const Q={
q1:{h:'Challenge 1 · In the laboratory',p:`Researchers have identified a potential weakness in CRAB: the molecular machine that carries lipopolysaccharide to its outer membrane (the LptB2FG complex). Block it, and the bacterium dies. But basic screening and chemical discovery is needed to find a working molecule.<br><b>How will you start early development?</b>`,
 o:[['os','Promote an international Open Science Platform so that scientists and citizens worldwide can share data and accelerate the process','Open access'],['pr','Offer research teams a financial Award upon antibiotic approval for whichever group brings a new antibiotic to market','Pull mechanism'],['vc','Attract Seed and Venture Capital','Patent-to-market model'],['g','Finance through Philanthropic and Public Grants','Push mechanism']]},
retry:{h:'RETRY · Back to the laboratory',rk:'q1',p:`Two years have passed and CRAB keeps spreading through intensive care units. Your committee still has no molecule, and the failed attempt has cost you Budget Points.<br>Both approaches failed because they rely on future payouts. Early research needs guaranteed funds upfront: a push mechanism. <b>Choose again.</b><br><span class="note">If your budget reaches 0 at any point, your committee is bankrupt: GAME OVER.</span>`,
 o:[['os','Promote an international Open Science Platform'],['g','Finance through Philanthropic and Public Grants']]},
q2:{h:'Before the trials: who owns LPT-7?',p:`LPT-7 works in mice. Before anyone spends €100 million on human trials, your committee must decide what happens to the intellectual property. This decision will define who can manufacture the antibiotic years from now.`,
 o:[['3','Patent it and sell exclusive worldwide rights to the highest-bidding pharmaceutical company.'],['2','Do not patent it. Publish the structure and the synthesis in the open domain so that anyone can use them.'],['1','Patent it and commit to responsible licensing: exclusivity only in high-income markets, non-exclusive licences for low- and middle-income countries.']]},
q3:{h:'Challenge 3 · Human clinical trials',p:`Now, choose how your committee will fund and manage Phase I, II and III human trials.`,
 o:[['hosp','Publish the trial protocol openly and ask public university hospitals worldwide to run the trials using their regular healthcare budgets, sharing all patient data openly in real time.'],['bt','Hand the molecule to a biotech startup and let them fund the trials, offering a guaranteed €100M Clinical Completion prize only upon delivering validated Phase III data to regulators. No prize if the trial fails.'],['cf','Launch a global crowdfunding campaign inviting citizens and patients to donate to fund clinical trials.'],['pdp','Partner with a non-profit organization to run trials using public money from multiple governments in exchange for non-exclusive licensing rights.']]},
q4:{h:'Challenge 4 · Manufacturing',p:`Producing antibiotics at global scale requires complex active pharmaceutical ingredient (API) synthesis, strict quality control, and zero-discharge wastewater treatment. The WHO committee is considering these manufacturing options.`,
 o:[['3','Refuse centralized hubs and require every country to build its own manufacturing plant to produce the antibiotic independently for its own population.'],['2','Hire one major multinational pharmaceutical company to produce the global supply in its existing high-tech US and European facilities, avoiding technology transfer delays.'],['4','Promote public grants to upgrade regional factories in developing countries.'],['1','Transfer the manufacturing recipe and technical know-how to multiple certified generic manufacturers. Contracts enforce low prices for developing nations and strict wastewater treatment rules.']]},
q5:{h:'Challenge 5 · Who pays the manufacturer?',p:`LPT-7 is approved and vials are being produced. Now comes the problem that bankrupted Achaogen: the antibiotic must be kept as a last resort, so almost nobody should use it.<br><b>Who pays the manufacturer, and how?</b> Choose how your committee will reward and distribute LPT-7.`,
 o:[['amc','Advance Market Commitment: donors promise in advance to buy a large, fixed volume of vials at a set price.'],['ctry','Country-by-country purchasing: let each country negotiate its own price directly with the manufacturer.'],['sub','Subscription model: health systems pay a fixed annual fee for having LPT-7 available, regardless of how many vials are used.'],['vol','Sell by volume: let the manufacturer set a market price and recover its costs through sales.']]},
q6:{h:'Final challenge · The last mile',p:`LPT-7 is paid for and available. Now it has to reach the right patients, and only them. Most hospitals where CRAB kills have no laboratory able to confirm the infection in time.<br><b>How will your committee manage its use?</b>`,
 o:[['don','Ask the manufacturer to donate doses to low-income countries.'],['wide','Make LPT-7 widely available, without prescription limits, so that no patient is left untreated.'],['rdt','Pair LPT-7 with a rapid diagnostic test and a responsible use plan: the antibiotic is released only for confirmed CRAB infections.'],['ref','Restrict LPT-7 to a few national reference hospitals that have full laboratories.']]}
};
const OKG=`Your committee secures non-dilutive public and philanthropic grants. Without the pressure of immediate commercial profit, university labs and small research teams rapidly screen thousands of compounds. They identify a new molecule, <b>LPT-7</b>, that blocks this transport machine and kills CRAB in animal tests! However, the grants are running dry, and moving from mice to Phase I, II and III human trials requires over €100 million (the “Death Valley”) and hundreds of patients across multiple countries.`;
const OKO=`By launching an open-access chemical library and data-sharing platform, scientists from multiple countries collaborate without patent secrecy. Avoiding duplicated work saves time and money. After a careful screening phase, an international team discovers <b>LPT-7</b>, which blocks this transport machine and clears CRAB infections in mice! But academic labs cannot run massive human clinical trials alone: Phase I, II and III will cost over €100 million. How will your committee avoid the Death Valley?`;
const M1=`Healthy competition among multiple certified manufacturers drives down production costs dramatically, while binding contracts enforce capped low prices and strict zero-discharge wastewater standards, so active antibiotic never leaks into local rivers. Affordable, high-quality vials roll off the lines. Yet vials in a warehouse do not guarantee they reach a rural clinic in time, nor do they stop overuse for minor infections. If prescribed carelessly, bacteria will evolve resistance within two years.`;
const M2=`A major multinational gives you an immediate head start: its FDA- and EMA-approved plants are already operating, skipping technology-transfer delays. However, every vial is expensive, out of reach for low-income health systems unless heavily subsidized. Relying on a single manufacturer also creates a global bottleneck: if that plant fails, the world’s supply halts overnight. You urgently need a global distribution and responsible-use strategy.`;
const M4=`The committee invests public grants to upgrade existing plants with sterile synthesis lines, wastewater treatment and quality systems. Once certified, regional hubs produce affordable doses where they are most needed, removing long supply chains and building permanent local capacity. But equipment, training and international inspections take two extra years and consume a large share of your budget. Now you must ensure the vials reach remote clinics without triggering overuse and resistance.`;

/* t=title, b=body, l=lesson, e=[bp,ap] (or function), go=game over, z=budget to 0, nx=next screen, ty=ok|warn|go */
const R={
'q1:g':{ty:'ok',t:'Finance through Philanthropic and Public Grants',b:OKG,e:[-15,0],nx:'q2',n:'Access +0 for now: this option may threaten accessibility; it will depend on the next phases.'},
'q1:vc':{ty:'warn',t:'Attract Seed and Venture Capital',b:`Your committee spends two years and money organizing investment summits and offering tax breaks to attract private venture capital. Every investor walks away. Their analysts point out the obvious: because the WHO requires this antibiotic to be kept in reserve as a “last resort”, sales will be tiny and they may never recover their investment. You still have no molecule and a depleted budget.`,e:[-20,0],nx:'retry'},
'q1:os':{ty:'ok',t:'International Open Science Platform',b:OKO,e:[-12,10],nx:'q2'},
'q1:pr':{ty:'warn',t:'Award upon antibiotic approval',b:`Your committee announces a massive prize for whichever lab brings a new antibiotic to market. Two years pass and nothing happens. Researchers and start-ups explain that a promise of money 10 years in the future does not pay today’s salaries, equipment or reagents. Resistant infections keep spreading, and you wasted 2 years and money on administration. You cannot enter clinical trials because no molecule has been discovered yet!`,e:[-15,0],nx:'retry'},
'q2:1':{ty:'ok',t:'Patent with responsible licensing',b:`Good decision. The patent gives future partners something to build on: whoever funds the trials knows the molecule cannot simply be copied in high-income markets. The licensing commitment, signed now, means generic manufacturers can supply low- and middle-income countries from the day of approval. Licensing does not pay for trials, though. You still need €100 million.`,e:[0,5],nx:'q3'},
'q2:2':{ty:'warn',t:'No patent',b:`Mixed result. Like Jonas Salk, who never patented the polio vaccine, you decide LPT-7 belongs to everyone. No legal barrier will ever stop a manufacturer from producing it. But open science removes the legal barrier, not the economic one. With no exclusivity anywhere, no company will risk its own capital on Phase III. Every euro of the trials must now come from public or donor money, and your committee spends extra effort persuading funders.`,e:[0,10],nx:'q3'},
'q2:3':{ty:'go',go:1,t:'Sell exclusive worldwide rights',h:'The molecule is shelved',b:`The sale brings in cash, and for a year everything looks fine. Then the buyer reviews its portfolio. An antibiotic that must be kept as a last resort will never sell in volume, so the company closes its antibiotic research unit, as several large pharmaceutical companies have done in recent years. LPT-7 is locked in a drawer, and the exclusive worldwide licence means nobody else can develop it.`,l:`A patent is a tool, not a plan. Exclusive rights with no access or development conditions let a single owner decide whether the drug exists at all.`},
'q3:pdp':{ty:'ok',t:'Partner with a non-profit organization (PDP)',b:`Strong success! By pooling public funds from multiple governments, the non-profit PDP absorbs the huge cost of human trials and crosses the Death Valley without private venture capital. Its established clinical network across dozens of hospitals makes recruitment fast and meets the strictest safety standards. The legal agreement guarantees non-exclusive licensing rights in over 160 low- and middle-income countries, enabling equitable access before a single vial is sold. The data show the antibiotic cures most patients with CRAB pneumonia and bloodstream infections, where existing drugs fail in around half of cases, and regulators in the US and Europe approve it! Now you must build a global manufacturing strategy.`,e:[-25,20],nx:'q4'},
'q3:cf':{ty:'go',go:1,z:1,t:'Launch a global crowdfunding campaign',h:'Massive funding shortfall',b:`Your campaign captures international attention, raising an impressive €1.2 million in three months. Unfortunately, enthusiasm is not enough to overcome the Death Valley of late-stage trials and your funds run out quickly. The molecule sits frozen in storage and the project is moved aside.`,l:`Crowdfunding can support basic lab experiments or patient advocacy, but grassroots donations cannot bridge the nine-figure “Valley of Death” of late-stage human trials.`},
'q3:hosp':{ty:'go',go:1,z:1,t:'Open-source protocol in public university hospitals',h:'Regulators reject the application',b:`Dozens of dedicated doctors agree to test your antibiotic using their standard hospital budgets, publishing all results openly. But overstretched public hospitals cannot afford the legal teams, independent safety auditors and €100+ million of trial insurance required for global Phase III trials. Several drop out mid-study, monitoring data is inconsistent across countries, and the FDA and EMA reject your application due to incomplete safety records. Without approval, no country can legally prescribe your antibiotic.`,l:`Open science is a powerhouse for early laboratory discovery, but late-stage human trials need dedicated, centralized funding and strict regulatory infrastructure that routine public hospital budgets cannot absorb.`},
'q3:bt':{ty:'ok',t:'Hand the molecule to a biotech startup',b:`The agile biotech executes the trials rapidly and delivers spotless data to the FDA and EMA. However, because the startup took on the operational risk upfront, it retains exclusive patent ownership over the clinical package and manufacturing process, which will make global generic production more expensive to negotiate later. The data show the antibiotic cures most patients with CRAB pneumonia and bloodstream infections, where existing drugs fail in around half of cases, and US and European regulators approve it! Now you must build a strong global manufacturing strategy.`,e:[-20,-15],nx:'q4'},
'q4:1':{ty:'ok',t:'Licensing via Medicines Patent Pool',b:M1,e:()=>S.path=='C'?[-25,25]:[-10,15],nx:'q5'},
'q4:2':{ty:'ok',t:'Single multinational pharmaceutical company',b:M2,e:[-20,-15],nx:'q5',goC:{go:1,h:'Extremely expensive drug',b:`Amina’s hospital in Lahore will not be able to afford it. With the clinical package owned by the biotech and a single high-cost manufacturer, LPT-7 is out of reach for low-income health systems.`,l:`Manufacturing choices must be compatible with earlier decisions on ownership and access.`}},
'q4:3':{ty:'go',go:1,z:1,t:'Every country builds its own plant',h:'Manufacturing paralysis',b:`Producing an antibiotic means synthesizing the active pharmaceutical ingredient (API). A certified API plant costs hundreds of millions of dollars and needs rare chemical-engineering expertise and raw-material supply chains most nations do not have. Almost no plants are completed, global production is near zero, and patients keep dying of treatable infections.`,l:`Equitable access does not mean every country building its own factory. It means pooling demand and licensing existing or regional manufacturing hubs.`},
'q4:4':{ty:'ok',t:'Public grants to upgrade regional factories',b:M4,e:()=>S.path=='C'?[-35,10]:[-25,10],nx:'q5'},
'q5:sub':{ty:'ok',t:'Subscription model',b:`Following the model the UK’s NHS has used since 2022 (expanded in 2024 to £100 million a year), health systems pay a fixed annual fee for access to LPT-7, the same whether a hospital uses ten vials or ten thousand. For the first time the manufacturer earns money while the antibiotic stays on the shelf, so LPT-7 remains a true last resort. Several high-income countries join, and their fees help fund a pooled access scheme for low- and middle-income countries. But a contract signed in a capital is not a treatment at a bedside: in a district hospital with no microbiology lab, how does a doctor know who needs LPT-7?`,e:[-15,15],nx:'q6'},
'q5:vol':{ty:'go',go:1,t:'Sell by volume',h:'Triggering new resistance',b:`To recover its costs, the manufacturer needs volume. Sales teams visit hospitals and LPT-7 becomes the first choice for any difficult infection instead of the last. Revenue is excellent for three years. Then the first LPT-7-resistant CRAB strain is isolated in an ICU, and within months it is reported on three continents.`,l:`This is the patent-and-market model, and for antibiotics it fails in both directions: used responsibly, the company goes bankrupt; sold well, resistance destroys the drug. Profit has to be separated from sales volume.`},
'q5:amc':{ty:'warn',t:'Advance Market Commitment',b:`Setback. The AMC worked for pneumococcal vaccines: a guaranteed price and volume brought them to Gavi countries about a year after high-income countries instead of a decade later. But a vaccine should reach as many people as possible, and a last-resort antibiotic as few as possible. Your AMC pays per vial, so donors bought millions of doses that must either be used, feeding resistance, or expire in warehouses. Experts raise the alarm and the committee cancels the contract before damage is done.`,l:`An AMC rewards volume. For an antibiotic, the reward must be independent of the volume used.`,e:[-20,5],nx:'q5'},
'q5:ctry':{ty:'go',go:1,t:'Country-by-country purchasing',h:'Leaving low-income nations behind',b:`High-income countries negotiate first and sign multi-year contracts for most of the production. Smaller, poorer health systems, each bargaining alone, face higher prices and are told to wait. It is the lesson of COVAX during COVID-19: when supply is limited and richer buyers purchase first, the countries with the heaviest burden end up at the back of the queue. In Lahore, the unit where Amina was treated still has no LPT-7.`,l:`Without pooled demand and a guaranteed payer, access depends on purchasing power.`},
'q6:rdt':{ty:'ok',win:1,t:'Rapid diagnostic test and responsible use plan',b:`Success! Your committee funds the test through a challenge prize, the way the Longitude Prize on AMR rewarded, in 2024, a test that identifies a urinary infection and the right antibiotic in under 45 minutes. This time the prize works because the technology was almost ready: pull mechanisms reward the last steps, not the first ones. District hospitals can now confirm CRAB at the bedside. LPT-7 is released only for confirmed cases, every use is reported, and resistance is tracked in an open database shared by all countries.`,e:[-10,15]},
'q6:ref':{ty:'warn',t:'Restrict LPT-7 to national reference hospitals',b:`Setback. The responsible use plan is perfect: LPT-7 is used only where a full laboratory confirms CRAB, and no resistance appears. But reference hospitals are in capital cities. A patient in a district hospital eight hours away is too unstable to be transferred, and dies of an infection that a vial stored in the capital could have cured.`,l:`A responsible use plan without access is not a solution. Restricting use protects the drug, but not the patients who cannot reach it.`,e:[-10,-5],nx:'q6'},
'q6:wide':{ty:'go',go:1,t:'Make LPT-7 widely available',h:'Triggering new resistance',b:`With no prescription limits, LPT-7 is given for fevers, coughs and infections it was never meant to treat. Within two years, resistant CRAB strains are circulating and the antibiotic that took over a decade to develop no longer works.`,l:`Access without a responsible use plan destroys the drug for everyone, including the patients it was meant to protect.`},
'q6:don':{ty:'warn',t:'Ask the manufacturer to donate doses',b:`Setback. The manufacturer agrees and ships a first donation, with good press coverage. The following year a new management team reviews costs and the programme is quietly reduced. Hospitals cannot plan treatment around a gift that may not arrive.`,l:`Donations are voluntary and one-off. Sustainable access needs a recurring payer and a contract, not goodwill.`,e:[-5,-5],nx:'q6'}
};
const rank=v=>v<=0?['Mission failed','The roadmap did not survive.']:v<115?['Fragile victory','LPT-7 reaches patients, but the roadmap leaves a lot of value and access on the table.']:v<145?['Strong roadmap','A solid, sustainable pathway for LPT-7.']:['Gold Standard','An outstanding pathway: sustainable, accessible and resistance-aware.'];

/* ---------- ENGINE ---------- */
function reset(){S={name:'',bp:100,ap:0,path:null,src:null,log:[],status:'intro',tried:{}}}
function hud(){$('hud').hidden=S.status==='intro';$('bp').textContent=S.bp;$('ap').textContent=S.ap}
function save(){if(!SHEET_URL)return;
 const answers=['q1','q2','q3','q4','q5','q6'].map(q=>S.log.filter(l=>l.q===q).map(l=>SH[q][l.k]||l.k).join(' > '));
 const d={id:RUN_ID,answers,status:S.status,bp:S.bp,ap:S.ap,score:S.bp+S.ap};
 chain=chain.then(()=>fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)})).catch(()=>{})}
function show(h){app.innerHTML=h;scrollTo(0,0);hud()}
function title(){reset();show(`<div class="card center"><span class="tag">Interactive case</span><h1>Designing sustainable pathways for biomedical innovation: alternative models and public good strategies</h1><p style="color:var(--mu)"></p><p><button data-a="ctx1">Start</button></p></div>`)}
function ctx1(){S.status='playing';save();show(`<div class="card"><span class="tag">The story</span>${CTX1}<div id="more"><p class="center"><button data-a="ctx2">Continue</button></p></div></div>`)}
function ctx2(){$('more').innerHTML=`<hr style="border:0;border-top:1px solid var(--bd)">${CTX2}<p class="center"><button data-a="ask" data-q="q1">Challenge 1</button></p>`;scrollBy({top:300,behavior:'smooth'})}
function ask(id){const q=Q[id],tr=S.tried[q.rk||id]||[];
 show(`<div class="card"><h2>${q.h}</h2><p>${q.p}</p>${q.o.map(([k,t,s])=>{
  if(id==='q3'&&k==='bt'&&(S.src==='o'||S.nopat))return'';
  return`<button class="opt" data-a="pick" data-q="${id}" data-k="${k}" ${tr.includes(k)?'disabled':''}>${t}${s?` <small>(${s})</small>`:''}</button>`}).join('')}</div>`)}
function pick(id,k){const rk=Q[id].rk||id;let r=R[rk+':'+k];if(!r)return;
 (S.tried[rk]=S.tried[rk]||[]).push(k);
 if(rk==='q1'&&r.ty==='ok')S.src=k==='g'?'g':'o';
 if(rk==='q2'&&k==='2')S.nopat=1;
 if(rk==='q3'&&k==='pdp')S.path=S.src==='o'?'A':'B';
 if(rk==='q3'&&k==='bt')S.path='C';
 if(r.goC&&S.path==='C')r=Object.assign({},r,r.goC,{ty:'go',e:null});
 const e=typeof r.e==='function'?r.e():r.e;if(e){S.bp+=e[0];S.ap+=e[1]}
 let go=r.go;if(r.z)S.bp=0;
 if(S.bp<=0){S.bp=0;if(!go){go=1;r=Object.assign({},r,{h:'Bankrupt',l:'Your committee ran out of Budget Points.'})}}
 S.log.push({q:rk,k,bp:S.bp,ap:S.ap});
 S.status=go?'gameover':r.win?'won':'playing';save();hud();
 const eff=e&&e[0]?`<div class="fx"><span class="${e[0]<0?'neg':'pos'}">Budget ${e[0]>0?'+':''}${e[0]}</span></div>`:(go&&r.z?'<div class="fx"><span class="neg">Budget → 0</span></div>':'');
 const les=r.l?`<div class="les"><b>Lesson:</b> ${r.l}</div>`:'';
 if(go){show(`<div class="card center" style="border-color:var(--go)"><span class="tag go">GAME OVER</span><h1 style="color:var(--go)">${r.h||r.t}</h1></div><div class="card"><h2>${r.t}</h2><p>${r.b}</p>${eff}${les}<p class="note">Final budget: ${S.bp}. There is no way back from a Game Over. Thanks for playing!</p></div>`);return}
 if(r.win){const tot=S.bp+S.ap,[nm,rd]=rank(tot);
